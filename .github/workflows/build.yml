name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        run: |
          brew install ldid make xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos-roothide"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks-src"
          for t in theos theos-roothide; do
            # newer logos (777925d) breaks lines that go on after %orig
            git -C "$HOME/$t/vendor/logos" fetch --depth 1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
            git -C "$HOME/$t/vendor/logos" checkout FETCH_HEAD
            mkdir -p "$HOME/$t/sdks"
            cp -R "$HOME/sdks-src/iPhoneOS16.5.sdk" "$HOME/$t/sdks/"
          done

      - name: Build
        run: |
          THEOS="$HOME/theos" gmake package
          rm -rf .theos
          THEOS="$HOME/theos-roothide" gmake package THEOS_PACKAGE_SCHEME=roothide
          ls -l packages

      - name: Package info
        id: package
        run: |
          echo "name=$(sed -n 's/^Name: //p' control)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^Version: //p' control)" >> "$GITHUB_OUTPUT"

      # main -> release, everything else -> artifact
      - name: Upload artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: packages/*.deb

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v$VERSION"
          # this version's section of CHANGELOG.md
          changes=$(awk -v version="$VERSION" '/^## /{ found = ($2 == version); next } found' CHANGELOG.md | sed '/^$/d')
          notes=$(printf '%s\n\nRootless (Dopamine, palera1n): %s\nRootHide (Relaxin, Bootstrap, Dopamine-roothide): %s\n\nBuild %s' \
            "$changes" "$(cd packages && ls *_iphoneos-arm64.deb)" "$(cd packages && ls *_iphoneos-arm64e.deb)" "${GITHUB_SHA::7}")
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb --clobber
            gh release edit "$tag" --title "$NAME $VERSION" --notes "$notes" --latest
          else
            gh release create "$tag" packages/*.deb --title "$NAME $VERSION" --notes "$notes" --latest
          fi

      - name: Publish beta release
        if: startsWith(github.ref, 'refs/heads/beta/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v${VERSION/\~/-}"
          changes=$(awk -v version="$VERSION" '/^## /{ found = ($2 == version); next } found' CHANGELOG.md | sed '/^$/d')
          notes=$(printf '%s\n\nRootless (Dopamine, palera1n): %s\nRootHide (Relaxin, Bootstrap, Dopamine-roothide): %s\n\nBeta build %s' \
            "$changes" "$(cd packages && ls *_iphoneos-arm64.deb)" "$(cd packages && ls *_iphoneos-arm64e.deb)" "${GITHUB_SHA::7}")
          gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" \
            --title "LumenBoard ${VERSION/\~/-}" --notes "$notes" --draft --prerelease --latest=false
